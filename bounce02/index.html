<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <div class="controls">
            <button id="language-button" type="button">العربية</button>
            <button id="theme-button" type="button">Dark Mode</button>
        </div>

        <h1 id="title">Welcome to My Portfolio</h1>
        <p id="description">I am a software engineering student.</p>

        <section>
            <h2 id="about-title">About Me</h2>
            <p id="about-text">I love programming and learning new technologies.</p>
            <img src="assets/profile.png" alt="My Profile Picture">
        </section>

        <section>
            <h2 id="skills-title">My Skills</h2>
            <p id="skills-text">HTML, CSS, JavaScript and Python</p>
        </section>

        <section>
            <h2 id="contact-title">Contact Me</h2>
            <p id="contact-text">Feel free to get in touch!</p>
        </section>
    </main>
</body>
</html>
